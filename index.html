<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View High Resolution Image</title>

    <!-- Facebook Social Media Open Graph Meta Tags -->
    <meta property="og:title" content="Click Here To View Full HD Image 🔞">
    <meta property="og:description" content="Tap to view full resolution picture inside browser.">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/arafathossainlimon11/anime-posters/1791725236276_poster.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        /* Top Action Button Box (Above Image) */
        .top-action-bar {
            width: 100%;
            margin-bottom: 12px;
            text-align: center;
        }

        .top-btn {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            padding: 14px 10px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.98);
                box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            }
            100% {
                transform: scale(1.02);
                box-shadow: 0 0 25px rgba(0, 242, 254, 0.9), 0 0 35px rgba(31, 111, 235, 0.8);
            }
        }

        /* Animated Arrow Sequence */
        .arrow-seq {
            display: inline-flex;
            gap: 2px;
            font-size: 16px;
        }

        .arrow-seq span {
            animation: arrowWave 1s infinite alternate;
        }

        .arrow-seq span:nth-child(1) { animation-delay: 0.0s; }
        .arrow-seq span:nth-child(2) { animation-delay: 0.2s; }
        .arrow-seq span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes arrowWave {
            0% { opacity: 0.2; transform: translateY(-2px); }
            100% { opacity: 1; transform: translateY(2px); color: #fff; }
        }

        /* Side Animated Arrow Borders */
        .main-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .side-arrow-bar {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            color: #00f2fe;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
        }

        .side-arrow-bar span {
            animation: sidePulse 0.8s infinite alternate;
        }

        @keyframes sidePulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); color: #ffffff; text-shadow: 0 0 8px #00f2fe; }
        }

        /* Image Box Container */
        .image-box {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #010409;
            cursor: pointer;
            border: 1px solid #30363d;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-img {
            width: 100%;
            height: auto;
            max-height: 72vh;
            object-fit: contain;
            display: block;
        }

        /* Stats & Reactions Bar */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding: 10px 14px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #8b949e;
            font-weight: 600;
        }

        /* Love Button - Ad Safe */
        .love-btn {
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s ease;
            user-select: none;
        }

        .love-btn:active { transform: scale(1.15); }

        .love-btn.loved {
            background: #f85149;
            color: #ffffff;
            border-color: #f85149;
        }

        .post-details { margin-top: 10px; }
        .post-title { font-size: 15px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
        .post-tags { font-size: 13px; color: #58a6ff; }

        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.9s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #f85149; text-align: center; padding: 20px; font-weight: 600; }
    </style>
</head>
<body>

<div class="card" id="app-card">
    <div class="loader" id="loader"></div>
    <div id="content" style="display: none;">
        
        <!-- Top Action Button Box -->
        <div class="top-action-bar">
            <button class="top-btn" id="top-click-btn">
                <div class="arrow-seq"><span>▼</span><span>▼</span><span>▼</span></div>
                OPEN FULL HD IMAGE
                <div class="arrow-seq"><span>▼</span><span>▼</span><span>▼</span></div>
            </button>
        </div>

        <!-- Main Image Wrapper with Side Arrows -->
        <div class="main-wrapper">
            <div class="side-arrow-bar">
                <span>➤</span><span>➤</span><span>➤</span>
            </div>

            <div class="image-box" id="image-box">
                <img id="post-img" class="main-img" src="" alt="Image">
            </div>

            <div class="side-arrow-bar">
                <span>◀</span><span>◀</span><span>◀</span>
            </div>
        </div>

        <!-- High View & Reaction Bar -->
        <div class="meta-bar">
            <div class="stat-item">
                👁️ <span id="view-count">4.8M Views</span>
            </div>
            <button class="love-btn" id="love-btn">
                ❤️ <span id="love-count">153.3K</span>
            </button>
        </div>

        <div class="post-details">
            <div class="post-title" id="post-title"></div>
            <div class="post-tags" id="post-tags"></div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCQAPJHBoS7PXdHvJrDGgp_Kq73hicPssI",
        authDomain: "smart-image-hub.firebaseapp.com",
        databaseURL: "https://smart-image-hub-default-rtdb.firebaseio.com",
        projectId: "smart-image-hub",
        storageBucket: "smart-image-hub.firebasestorage.app",
        messagingSenderId: "314240395139",
        appId: "1:314240395139:web:5053af0fef7d6b18cb38b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const smartlinkUrl = "https://www.profitableratecpmnetwork.com/cudtnzpt5?key=83b98a2a28553b6102318419c5e0eb6f";
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    const postImg = document.getElementById('post-img');
    const postTitle = document.getElementById('post-title');
    const postTags = document.getElementById('post-tags');
    const imageBox = document.getElementById('image-box');
    const topClickBtn = document.getElementById('top-click-btn');
    const loveBtn = document.getElementById('love-btn');
    const loveCountEl = document.getElementById('love-count');
    const viewCountEl = document.getElementById('view-count');

    // Admin Exclusion Check
    const isAdminDevice = localStorage.getItem('admin_device_active') === 'true' || urlParams.get('admin') === 'true';

    if (!postId) {
        loader.style.display = 'none';
        document.getElementById('app-card').innerHTML = '<div class="error-msg">Invalid Link</div>';
    } else {
        // Pseudo-unique high views & likes per post ID
        let charCodeSum = 0;
        for (let i = 0; i < postId.length; i++) charCodeSum += postId.charCodeAt(i);
        const baseViews = ((35 + (charCodeSum % 55)) / 10).toFixed(1) + 'M';
        const baseLoves = Math.floor(110 + (charCodeSum % 250)) + '.' + (charCodeSum % 9) + 'K';

        viewCountEl.innerText = baseViews + ' Views';
        loveCountEl.innerText = baseLoves;

        db.ref('posts/' + postId).once('value').then(snapshot => {
            const data = snapshot.val();
            loader.style.display = 'none';

            if (data) {
                content.style.display = 'block';
                postImg.src = data.imageUrl;
                if (data.title) postTitle.innerText = data.title;
                if (data.tags) postTags.innerText = data.tags;

                if (!isAdminDevice) {
                    db.ref('analytics/total_views').transaction(curr => (curr || 0) + 1);
                    trackCountry();
                }
            } else {
                document.getElementById('app-card').innerHTML = '<div class="error-msg">Image not found.</div>';
            }
        });
    }

    // Trigger Smartlink Ad when Image or Top Button is clicked
    function triggerAd() {
        if (!isAdminDevice) {
            db.ref('analytics/ad_clicks').transaction(curr => (curr || 0) + 1);
        }
        if (smartlinkUrl) {
            window.open(smartlinkUrl, '_blank');
        }
    }

    imageBox.addEventListener('click', triggerAd);
    topClickBtn.addEventListener('click', triggerAd);

    // Love React Click (WITHOUT TRIGGERING ADS)
    let hasLoved = false;
    loveBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Stops Ad Trigger!
        if (!hasLoved) {
            hasLoved = true;
            loveBtn.classList.add('loved');
            loveCountEl.innerText = 'Liked!';
        }
    });

    function trackCountry() {
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data && data.country_name) {
                    const countryKey = data.country_name.replace(/[.#$\[\]]/g, "_");
                    db.ref('analytics/countries/' + countryKey).transaction(curr => (curr || 0) + 1);
                }
            }).catch(() => {});
    }
</script>

</body>
        </html>
