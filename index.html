<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View High Resolution Image</title>

    <!-- Facebook Social Media Open Graph Meta Tags -->
    <meta property="og:title" content="Click Here To View Full HD Image 🔞">
    <meta property="og:description" content="Tap to unlock and view full resolution picture inside browser.">
    <meta property="og:image" content="https://cdn.jsdelivr.net/gh/arafathossainlimon11/anime-posters/1791725236276_poster.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.85);
            position: relative;
        }

        /* Top Action Button Box */
        .top-action-bar {
            width: 100%;
            margin-bottom: 12px;
            text-align: center;
        }

        .top-btn {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #00f2fe 100%);
            color: #ffffff;
            border: none;
            padding: 13px 10px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            box-shadow: 0 0 18px rgba(0, 242, 254, 0.5);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: pulseGlow 1.2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.98); box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
            100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 242, 254, 0.9), 0 0 35px rgba(31, 111, 235, 0.8); }
        }

        .arrow-seq { display: inline-flex; gap: 2px; font-size: 15px; }
        .arrow-seq span { animation: arrowWave 1s infinite alternate; }
        .arrow-seq span:nth-child(1) { animation-delay: 0.0s; }
        .arrow-seq span:nth-child(2) { animation-delay: 0.2s; }
        .arrow-seq span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes arrowWave {
            0% { opacity: 0.2; transform: translateY(-2px); }
            100% { opacity: 1; transform: translateY(2px); color: #fff; }
        }

        /* Side Animated Arrow Borders */
        .main-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .side-arrow-bar {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
            color: #00f2fe;
            font-weight: bold;
            font-size: 14px;
            user-select: none;
        }

        .side-arrow-bar span { animation: sidePulse 0.8s infinite alternate; }
        @keyframes sidePulse {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); color: #ffffff; text-shadow: 0 0 8px #00f2fe; }
        }

        /* Main Image Container */
        .image-box {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #010409;
            cursor: pointer;
            border: 1px solid #30363d;
            min-height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-img {
            width: 100%;
            height: auto;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        /* Multi-Image Thumbnail Grid */
        .grid-title {
            margin-top: 14px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-top: 6px;
        }

        .thumb-box {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #0d1117;
            border: 2px solid #30363d;
            cursor: pointer;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .thumb-box:hover, .thumb-box.active {
            border-color: #00f2fe;
            transform: scale(1.02);
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
        }

        .thumb-overlay {
            position: absolute;
            inset: 0;
            background: rgba(11, 14, 20, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #00f2fe;
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            padding: 4px;
            gap: 4px;
            user-select: none;
        }

        .thumb-overlay .lock-icon { font-size: 18px; }

        /* Stats & Reactions Bar */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 10px 14px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #8b949e;
            font-weight: 600;
        }

        .love-btn {
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s ease;
            user-select: none;
        }

        .love-btn:active { transform: scale(1.15); }
        .love-btn.loved { background: #f85149; color: #ffffff; border-color: #f85149; }

        .post-details { margin-top: 10px; }
        .post-title { font-size: 15px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px; }
        .post-tags { font-size: 13px; color: #58a6ff; }

        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.9s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-msg { color: #f85149; text-align: center; padding: 20px; font-weight: 600; }
    </style>
</head>
<body>

<div class="card" id="app-card">
    <div class="loader" id="loader"></div>
    <div id="content" style="display: none;">
        
        <!-- Top Action Button -->
        <div class="top-action-bar">
            <button class="top-btn" id="top-click-btn">
                <div class="arrow-seq"><span>▼</span><span>▼</span><span>▼</span></div>
                TAP TO OPEN FULL HD IMAGE
                <div class="arrow-seq"><span>▼</span><span>▼</span><span>▼</span></div>
            </button>
        </div>

        <!-- Main Display Image -->
        <div class="main-wrapper">
            <div class="side-arrow-bar"><span>➤</span><span>➤</span><span>➤</span></div>

            <div class="image-box" id="image-box">
                <img id="post-img" class="main-img" src="" alt="Image">
            </div>

            <div class="side-arrow-bar"><span>◀</span><span>◀</span><span>◀</span></div>
        </div>

        <!-- Multi-Image Gallery Thumbnails (Hidden from FB Scraper) -->
        <div id="gallery-section" style="display: none;">
            <div class="grid-title">
                <span>📸</span> MORE EXCLUSIVE IMAGES (TAP TO UNLOCK):
            </div>
            <div class="thumbnails-grid" id="thumbnails-grid"></div>
        </div>

        <!-- Realistic View & Reaction Bar -->
        <div class="meta-bar">
            <div class="stat-item">
                👁️ <span id="view-count">6.4K Views</span>
            </div>
            <button class="love-btn" id="love-btn">
                ❤️ <span id="love-count">2.3K</span>
            </button>
        </div>

        <div class="post-details">
            <div class="post-title" id="post-title"></div>
            <div class="post-tags" id="post-tags"></div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCQAPJHBoS7PXdHvJrDGgp_Kq73hicPssI",
        authDomain: "smart-image-hub.firebaseapp.com",
        databaseURL: "https://smart-image-hub-default-rtdb.firebaseio.com",
        projectId: "smart-image-hub",
        storageBucket: "smart-image-hub.firebasestorage.app",
        messagingSenderId: "314240395139",
        appId: "1:314240395139:web:5053af0fef7d6b18cb38b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Your Updated Smartlink Ad URL
    const smartlinkUrl = "https://www.profitableratecpmnetwork.com/vmvr72na?key=18c18b91177b0cc6a184d070742c0821";
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    const postImg = document.getElementById('post-img');
    const postTitle = document.getElementById('post-title');
    const postTags = document.getElementById('post-tags');
    const imageBox = document.getElementById('image-box');
    const topClickBtn = document.getElementById('top-click-btn');
    const gallerySection = document.getElementById('gallery-section');
    const thumbnailsGrid = document.getElementById('thumbnails-grid');
    const loveBtn = document.getElementById('love-btn');
    const loveCountEl = document.getElementById('love-count');
    const viewCountEl = document.getElementById('view-count');

    // Admin Device Check
    const isAdminDevice = localStorage.getItem('admin_device_active') === 'true' || urlParams.get('admin') === 'true';

    let allImages = [];
    let currentImageIndex = 0;

    if (!postId) {
        loader.style.display = 'none';
        document.getElementById('app-card').innerHTML = '<div class="error-msg">Invalid Link</div>';
    } else {
        // Calculate realistic Views (5.2K - 9.8K) and Likes (1.2K - 3.8K)
        let charSum = 0;
        for (let i = 0; i < postId.length; i++) charSum += postId.charCodeAt(i);
        const calcViews = ((52 + (charSum % 47)) / 10).toFixed(1) + 'K Views';
        const calcLoves = ((12 + (charSum % 25)) / 10).toFixed(1) + 'K';

        viewCountEl.innerText = calcViews;
        loveCountEl.innerText = calcLoves;

        db.ref('posts/' + postId).once('value').then(snapshot => {
            const data = snapshot.val();
            loader.style.display = 'none';

            if (data) {
                content.style.display = 'block';

                // Collect Link 1 and additional images
                allImages = [data.imageUrl];
                if (data.extraImages && Array.isArray(data.extraImages)) {
                    data.extraImages.forEach(img => {
                        if (img && img.trim() !== '') allImages.push(img.trim());
                    });
                }

                postImg.src = allImages[0];
                if (data.title) postTitle.innerText = data.title;
                if (data.tags) postTags.innerText = data.tags;

                // Render Multi-Image Gallery Thumbnails if more than 1 image
                if (allImages.length > 1) {
                    gallerySection.style.display = 'block';
                    thumbnailsGrid.innerHTML = '';

                    allImages.forEach((imgUrl, index) => {
                        const thumbBox = document.createElement('div');
                        thumbBox.className = 'thumb-box' + (index === 0 ? ' active' : '');
                        thumbBox.innerHTML = `
                            <img src="${imgUrl}" class="thumb-img" alt="thumb">
                            <div class="thumb-overlay">
                                <span class="lock-icon">${index === 0 ? '👁️' : '🔒'}</span>
                                <span>${index === 0 ? 'MAIN IMAGE' : 'UNLOCK #' + (index + 1)}</span>
                            </div>
                        `;

                        thumbBox.addEventListener('click', function() {
                            currentImageIndex = index;
                            postImg.src = allImages[index];
                            document.querySelectorAll('.thumb-box').forEach(b => b.classList.remove('active'));
                            thumbBox.classList.add('active');
                            triggerAd();
                        });

                        thumbnailsGrid.appendChild(thumbBox);
                    });
                }

                // Track Real Analytics & Individual Post Views for Non-Admin Devices
                if (!isAdminDevice) {
                    db.ref('analytics/total_views').transaction(curr => (curr || 0) + 1);
                    db.ref('posts/' + postId + '/realViews').transaction(curr => (curr || 0) + 1);
                    trackCountry();
                }
            } else {
                document.getElementById('app-card').innerHTML = '<div class="error-msg">Image not found.</div>';
            }
        });
    }

    // Trigger Smartlink Ad on image or top button click
    function triggerAd() {
        if (!isAdminDevice) {
            db.ref('analytics/ad_clicks').transaction(curr => (curr || 0) + 1);
        }
        if (smartlinkUrl) {
            window.open(smartlinkUrl, '_blank');
        }
    }

    imageBox.addEventListener('click', triggerAd);
    topClickBtn.addEventListener('click', triggerAd);

    // Love React Click (WITHOUT TRIGGERING ADS)
    let hasLoved = false;
    loveBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Stops Ad Trigger!
        if (!hasLoved) {
            hasLoved = true;
            loveBtn.classList.add('loved');
            loveCountEl.innerText = 'Liked!';
        }
    });

    function trackCountry() {
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data && data.country_name) {
                    const countryKey = data.country_name.replace(/[.#$\[\]]/g, "_");
                    db.ref('analytics/countries/' + countryKey).transaction(curr => (curr || 0) + 1);
                }
            }).catch(() => {});
    }
</script>

</body>
    </html>
