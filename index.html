<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open HD Image</title>

    <!-- Facebook Social Media Open Graph Tags (Fixes FB Blank Image) -->
    <meta property="og:title" content="Click Here To View Full HD Image 🔞">
    <meta property="og:description" content="Tap to unlock and view high-resolution image inside browser.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1200&q=80">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e6edf3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        .card {
            width: 100%;
            max-width: 480px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .image-box {
            position: relative;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #010409;
            cursor: pointer;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .main-img {
            width: 100%;
            height: auto;
            max-height: 72vh;
            object-fit: contain;
            filter: blur(14px);
            transition: filter 0.4s ease;
            display: block;
        }

        .main-img.unblur {
            filter: blur(0px) !important;
        }

        /* Glowing Animated Arrow Button Inside Image */
        .open-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(11, 14, 20, 0.92);
            border: 2px solid #00f2fe;
            color: #00f2fe;
            padding: 14px 22px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px #00f2fe, inset 0 0 10px #00f2fe;
            animation: pulseGlow 1.4s infinite alternate;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            user-select: none;
        }

        .arrow-glow {
            animation: arrowBounce 0.8s infinite alternate;
            font-size: 18px;
        }

        @keyframes arrowBounce {
            from { transform: translateX(-4px); }
            to { transform: translateX(4px); }
        }

        @keyframes pulseGlow {
            0% {
                transform: translate(-50%, -50%) scale(0.96);
                box-shadow: 0 0 10px #00f2fe;
                border-color: #00f2fe;
                color: #00f2fe;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.04);
                box-shadow: 0 0 28px #00f2fe, 0 0 40px #4facfe;
                border-color: #ffffff;
                color: #ffffff;
            }
        }

        /* Stats & Reactions Bar */
        .meta-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding: 10px 14px;
            background: #0d1117;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #8b949e;
            font-weight: 600;
        }

        /* Love Button - Totally Free From Ads */
        .love-btn {
            background: rgba(248, 81, 73, 0.15);
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #f85149;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.2s ease;
            user-select: none;
        }

        .love-btn:active {
            transform: scale(1.18);
        }

        .love-btn.loved {
            background: #f85149;
            color: #ffffff;
            border-color: #f85149;
        }

        .post-details {
            margin-top: 12px;
        }

        .post-title {
            font-size: 16px;
            font-weight: 600;
            color: #f0f6fc;
            margin-bottom: 4px;
        }

        .post-tags {
            font-size: 13px;
            color: #58a6ff;
        }

        .loader {
            border: 4px solid #30363d;
            border-top: 4px solid #00f2fe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 0.9s linear infinite;
            margin: 30px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #f85149;
            text-align: center;
            padding: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card" id="app-card">
    <div class="loader" id="loader"></div>
    <div id="content" style="display: none;">
        <div class="image-box" id="image-box">
            <img id="post-img" class="main-img" src="" alt="Image">
            <button class="open-btn" id="open-btn">
                <span class="arrow-glow">➔</span> OPEN IMAGE <span class="arrow-glow">⬅</span>
            </button>
        </div>

        <!-- High View & Reaction Bar -->
        <div class="meta-bar">
            <div class="stat-item">
                👁️ <span id="view-count">3.8M Views</span>
            </div>
            <!-- Love Button (Ad Safe) -->
            <button class="love-btn" id="love-btn">
                ❤️ <span id="love-count">142.5K</span>
            </button>
        </div>

        <div class="post-details">
            <div class="post-title" id="post-title"></div>
            <div class="post-tags" id="post-tags"></div>
        </div>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCQAPJHBoS7PXdHvJrDGgp_Kq73hicPssI",
        authDomain: "smart-image-hub.firebaseapp.com",
        databaseURL: "https://smart-image-hub-default-rtdb.firebaseio.com",
        projectId: "smart-image-hub",
        storageBucket: "smart-image-hub.firebasestorage.app",
        messagingSenderId: "314240395139",
        appId: "1:314240395139:web:5053af0fef7d6b18cb38b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const smartlinkUrl = "https://www.profitableratecpmnetwork.com/cudtnzpt5?key=83b98a2a28553b6102318419c5e0eb6f";
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    const loader = document.getElementById('loader');
    const content = document.getElementById('content');
    const postImg = document.getElementById('post-img');
    const postTitle = document.getElementById('post-title');
    const postTags = document.getElementById('post-tags');
    const openBtn = document.getElementById('open-btn');
    const imageBox = document.getElementById('image-box');
    const loveBtn = document.getElementById('love-btn');
    const loveCountEl = document.getElementById('love-count');
    const viewCountEl = document.getElementById('view-count');

    // Admin Exclusion Check
    const isAdminDevice = localStorage.getItem('admin_device_active') === 'true' || urlParams.get('admin') === 'true';

    // Base Fake High Stats Calculation based on Post ID
    let baseViews = 3800000;
    let baseLoves = 142500;

    if (!postId) {
        loader.style.display = 'none';
        document.getElementById('app-card').innerHTML = '<div class="error-msg">Invalid Link</div>';
    } else {
        // Generate pseudo-unique high numbers per post
        let charCodeSum = 0;
        for (let i = 0; i < postId.length; i++) charCodeSum += postId.charCodeAt(i);
        baseViews = (25 + (charCodeSum % 65)) / 10 + 'M'; // e.g., 4.2M, 5.8M
        baseLoves = Math.floor(120 + (charCodeSum % 280)) + '.' + (charCodeSum % 9) + 'K';

        viewCountEl.innerText = baseViews + ' Views';
        loveCountEl.innerText = baseLoves;

        db.ref('posts/' + postId).once('value').then(snapshot => {
            const data = snapshot.val();
            loader.style.display = 'none';

            if (data) {
                content.style.display = 'block';
                postImg.src = data.imageUrl;
                if (data.title) postTitle.innerText = data.title;
                if (data.tags) postTags.innerText = data.tags;

                // Track analytics only for non-admin users
                if (!isAdminDevice) {
                    db.ref('analytics/total_views').transaction(curr => (curr || 0) + 1);
                    trackCountry();
                }
            } else {
                document.getElementById('app-card').innerHTML = '<div class="error-msg">Image not found.</div>';
            }
        });
    }

    // Trigger Smartlink Ad when Image or OPEN Button clicked
    imageBox.addEventListener('click', function() {
        postImg.classList.add('unblur');
        openBtn.style.display = 'none';

        if (!isAdminDevice) {
            db.ref('analytics/ad_clicks').transaction(curr => (curr || 0) + 1);
        }

        if (smartlinkUrl) {
            window.open(smartlinkUrl, '_blank');
        }
    });

    // Love React Click (WITHOUT TRIGGERING ADS)
    let hasLoved = false;
    loveBtn.addEventListener('click', function(e) {
        e.stopPropagation(); // Prevents Ad Trigger!
        
        if (!hasLoved) {
            hasLoved = true;
            loveBtn.classList.add('loved');
            loveCountEl.innerText = 'Liked!';
        }
    });

    function trackCountry() {
        fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(data => {
                if (data && data.country_name) {
                    const countryKey = data.country_name.replace(/[.#$\[\]]/g, "_");
                    db.ref('analytics/countries/' + countryKey).transaction(curr => (curr || 0) + 1);
                }
            }).catch(() => {});
    }
</script>

</body>
    </html>
