<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 15px; min-height: 100vh; }
        
        .auth-box { max-width: 400px; margin: 80px auto; background: #161b22; padding: 30px; border-radius: 12px; border: 1px solid #30363d; text-align: center; }
        .auth-box input { width: 100%; padding: 12px; margin: 15px 0; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; font-size: 16px; }
        
        .btn { background: #238636; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        .btn:hover { background: #2ea043; }
        .btn-danger { background: #da3633; }
        .btn-secondary { background: #30363d; }
        .btn-secondary:hover { background: #484f58; }
        .btn-info { background: #1f6feb; }

        .dashboard { max-width: 900px; margin: 0 auto; display: none; }
        .nav-tabs { display: flex; gap: 10px; border-bottom: 1px solid #30363d; padding-bottom: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn { background: #21262d; color: #8b949e; border: 1px solid #30363d; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .tab-btn.active { background: #1f6feb; color: #ffffff; border-color: #1f6feb; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; }
        .form-group input { width: 100%; padding: 10px; background: #161b22; border: 1px solid #30363d; border-radius: 6px; color: #fff; }

        .extra-img-box { display: flex; gap: 10px; margin-bottom: 10px; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: #161b22; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        th { background: #21262d; color: #f0f6fc; }

        .thumb-img { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid #30363d; }
        .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }

        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; text-align: center; }
        .card h3 { font-size: 28px; color: #58a6ff; margin-top: 5px; }

        .device-bar { background: #1f2937; padding: 12px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #374151; }
        .view-badge { background: rgba(0, 242, 254, 0.15); color: #00f2fe; padding: 4px 8px; border-radius: 12px; font-weight: 700; font-size: 12px; border: 1px solid rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body>

<!-- Login Box -->
<div class="auth-box" id="login-box">
    <h2>Admin Login</h2>
    <input type="password" id="admin-pass" placeholder="Enter Password">
    <button class="btn" onclick="login()">Access Panel</button>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboard">
    <div class="device-bar">
        <span>📱 Device Status: <strong style="color:#3fb950;">Admin Phone Registered</strong></span>
        <button class="btn btn-info" onclick="registerAdminPhone()">Register This Phone</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-create')">➕ New Post</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-posts')">📁 Published Posts</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-analytics')">📊 Viewers & Analytics</button>
    </div>

    <!-- Tab 1: Create Post -->
    <div id="tab-create" class="tab-content active">
        <div style="background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d;">
            <div class="form-group">
                <label>Main Cover Image URL / Link 1 (Required):</label>
                <input type="text" id="img-url-1" placeholder="https://cdn.jsdelivr.net/...">
            </div>

            <div id="extra-images-container"></div>

            <button type="button" class="btn btn-secondary" style="margin-bottom: 15px;" onclick="addMoreImageField()">➕ Add More Image Link</button>

            <div class="form-group">
                <label>Title (Optional):</label>
                <input type="text" id="img-title" placeholder="Enter post title">
            </div>
            <div class="form-group">
                <label>Hashtags (Optional):</label>
                <input type="text" id="img-tags" placeholder="#anime #viral">
            </div>
            <button class="btn" onclick="publishPost()">Publish Post</button>
            <div id="publish-success" style="margin-top: 15px; color: #3fb950; font-weight: bold;"></div>
        </div>
    </div>

    <!-- Tab 2: Manage Posts -->
    <div id="tab-posts" class="tab-content">
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Details & Real Views</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="posts-table-body"></tbody>
        </table>
    </div>

    <!-- Tab 3: Analytics -->
    <div id="tab-analytics" class="tab-content">
        <div class="stat-cards">
            <div class="card">
                <p>Total Real Page Views</p>
                <h3 id="stat-views">0</h3>
            </div>
            <div class="card">
                <p>Ad Clicks</p>
                <h3 id="stat-clicks">0</h3>
            </div>
            <div class="card">
                <p>Exited Without Click</p>
                <h3 id="stat-bounced">0</h3>
            </div>
        </div>

        <h3 style="margin-bottom: 10px;">Top Visitors Countries</h3>
        <table>
            <thead>
                <tr>
                    <th>Country</th>
                    <th>Visitors Count</th>
                </tr>
            </thead>
            <tbody id="country-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyCQAPJHBoS7PXdHvJrDGgp_Kq73hicPssI",
        authDomain: "smart-image-hub.firebaseapp.com",
        databaseURL: "https://smart-image-hub-default-rtdb.firebaseio.com",
        projectId: "smart-image-hub",
        storageBucket: "smart-image-hub.firebasestorage.app",
        messagingSenderId: "314240395139",
        appId: "1:314240395139:web:5053af0fef7d6b18cb38b6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let extraImageCount = 1;

    function registerAdminPhone() {
        localStorage.setItem('admin_device_active', 'true');
        alert('This phone is registered as Admin! Your views will NOT be counted.');
    }

    function login() {
        const pass = document.getElementById('admin-pass').value;
        if (pass === 'arafat01721313101') {
            registerAdminPhone();
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadPosts();
            loadAnalytics();
        } else {
            alert('Incorrect Password!');
        }
    }

    function switchTab(e, tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        e.target.classList.add('active');
    }

    function addMoreImageField() {
        extraImageCount++;
        const container = document.getElementById('extra-images-container');
        const div = document.createElement('div');
        div.className = 'form-group extra-img-box';
        div.innerHTML = `
            <input type="text" class="extra-img-input" placeholder="Image Link ${extraImageCount} URL">
            <button type="button" class="btn btn-danger" onclick="this.parentElement.remove()">X</button>
        `;
        container.appendChild(div);
    }

    function publishPost() {
        const mainUrl = document.getElementById('img-url-1').value.trim();
        const title = document.getElementById('img-title').value.trim();
        const tags = document.getElementById('img-tags').value.trim();

        if (!mainUrl) {
            alert('Please enter Link 1 (Main Image URL)!');
            return;
        }

        const extraInputs = document.querySelectorAll('.extra-img-input');
        const extraImages = [];
        extraInputs.forEach(input => {
            if (input.value.trim() !== '') {
                extraImages.push(input.value.trim());
            }
        });

        const newPostRef = db.ref('posts').push();
        newPostRef.set({
            imageUrl: mainUrl,
            extraImages: extraImages,
            title: title,
            tags: tags,
            realViews: 0,
            timestamp: Date.now()
        }).then(() => {
            const baseUrl = window.location.href.replace('admin.html', '');
            const shareUrl = `${baseUrl}?id=${newPostRef.key}`;
            
            document.getElementById('publish-success').innerHTML = `
                Post Published Successfully!<br>
                <input type="text" value="${shareUrl}" id="share-link-input" style="padding:6px; width:80%; margin-top:8px;" readonly>
                <button class="btn" style="padding:6px 12px; margin-top:5px;" onclick="copyShareLink()">Copy Link</button>
            `;
            document.getElementById('img-url-1').value = '';
            document.getElementById('extra-images-container').innerHTML = '';
            document.getElementById('img-title').value = '';
            document.getElementById('img-tags').value = '';
            extraImageCount = 1;
        }).catch(err => {
            alert("Error: " + err.message);
        });
    }

    function copyShareLink() {
        const input = document.getElementById('share-link-input');
        input.select();
        document.execCommand('copy');
        alert('Link Copied!');
    }

    function loadPosts() {
        db.ref('posts').on('value', snapshot => {
            const tbody = document.getElementById('posts-table-body');
            tbody.innerHTML = '';
            const data = snapshot.val();

            if (data) {
                const baseUrl = window.location.href.replace('admin.html', '');
                Object.keys(data).reverse().forEach(key => {
                    const post = data[key];
                    const shareUrl = `${baseUrl}?id=${key}`;
                    const realViews = post.realViews || 0;
                    const totalImgs = 1 + (post.extraImages ? post.extraImages.length : 0);
                    
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><img src="${post.imageUrl}" class="thumb-img" alt="thumb"></td>
                        <td>
                            <strong>${post.title || 'No Title'}</strong><br>
                            <small style="color:#8b949e;">${post.tags || ''}</small><br>
                            <span class="view-badge">👁️ Real Views: ${realViews}</span>
                            <span style="font-size:11px; color:#8b949e; margin-left:6px;">📸 ${totalImgs} Images</span>
                        </td>
                        <td class="actions-cell">
                            <button class="btn btn-secondary" onclick="navigator.clipboard.writeText('${shareUrl}'); alert('Link Copied!');">Copy Link</button>
                            <button class="btn btn-secondary" onclick="window.open('${shareUrl}', '_blank')">View</button>
                            <button class="btn btn-danger" onclick="if(confirm('Delete post?')) db.ref('posts/${key}').remove();">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="3">No posts published yet.</td></tr>';
            }
        });
    }

    function getFlagEmoji(countryName) {
        const flags = {
            "United States": "🇺🇸", "Bangladesh": "🇧🇩", "India": "🇮🇳",
            "Pakistan": "🇵🇰", "United Kingdom": "🇬🇧", "Canada": "🇨🇦",
            "Saudi Arabia": "🇸🇦", "United Arab Emirates": "🇦🇪", "Malaysia": "🇲🇾",
            "Germany": "🇩🇪", "France": "🇫🇷", "Italy": "🇮🇹", "Brazil": "🇧🇷"
        };
        return flags[countryName] || "🏳️";
    }

    function loadAnalytics() {
        db.ref('analytics').on('value', snapshot => {
            const data = snapshot.val() || {};
            const totalViews = data.total_views || 0;
            const adClicks = data.ad_clicks || 0;
            const bounced = Math.max(0, totalViews - adClicks);

            document.getElementById('stat-views').innerText = totalViews;
            document.getElementById('stat-clicks').innerText = adClicks;
            document.getElementById('stat-bounced').innerText = bounced;

            const countryTable = document.getElementById('country-table-body');
            countryTable.innerHTML = '';

            if (data.countries) {
                Object.keys(data.countries).forEach(c => {
                    const countryName = c.replace(/_/g, " ");
                    const flag = getFlagEmoji(countryName);
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${flag} ${countryName}</td><td><strong>${data.countries[c]}</strong></td>`;
                    countryTable.appendChild(row);
                });
            } else {
                countryTable.innerHTML = '<tr><td colspan="2">No country data recorded yet.</td></tr>';
            }
        });
    }
</script>

</body>
        </html>
